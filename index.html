<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>みんなの辛いこと</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: 'Gloria Hallelujah', cursive;
      background: #fdf6e3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .card {
      width: 80%;
      max-width: 500px;
      background: white;
      padding: 30px;
      border: 6px solid #4caf50;
      border-radius: 20px;
      box-shadow: 6px 6px 0px #333;
      font-size: 1.2rem;
      text-align: center;
      position: absolute;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .buttons {
      position: fixed;
      bottom: 20px;
      display: flex;
      gap: 20px;
    }
    button {
      font-family: 'Gloria Hallelujah', cursive;
      font-size: 1rem;
      padding: 10px 20px;
      border: 3px solid #333;
      border-radius: 12px;
      background: #ffeb3b;
      cursor: pointer;
      box-shadow: 3px 3px 0px #333;
    }
    button:hover {
      background: #ffd54f;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&display=swap" rel="stylesheet">
</head>
<body>
  <div id="cards">読み込み中…</div>
  <div class="buttons">
    <button onclick="prevCard()">← 戻る</button>
    <button onclick="nextCard()">→ 次へ</button>
  </div>

  <script>
    const sheetUrl = "https://docs.google.com/spreadsheets/d/1vDbt5nQeH_zgMjJCDnMaB6oGhMMPc2vv-ixQ4zYI9A8/gviz/tq?tqx=out:csv";
    let data = [];
    let current = 0;

    async function loadData() {
      const res = await fetch(sheetUrl);
      const text = await res.text();
      const rows = text.split("\n").map(r => r.split(","));
      // 1行目はヘッダーなので飛ばす
      data = rows.slice(1).map(r => r[1]).filter(x => x); 
      renderCard(current);
    }

    function renderCard(index) {
      const cardsContainer = document.getElementById("cards");
      cardsContainer.innerHTML = "";
      if (data.length === 0) {
        cardsContainer.innerHTML = "データなし";
        return;
      }
      const card = document.createElement("div");
      card.className = "card";
      card.innerText = data[index];
      cardsContainer.appendChild(card);
    }

    function nextCard() {
      if (current < data.length - 1) {
        current++;
        renderCard(current);
      }
    }
    function prevCard() {
      if (current > 0) {
        current--;
        renderCard(current);
      }
    }

    loadData();
  </script>
</body>
</html>
