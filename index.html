<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>みんなの辛いことスライダー</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #a2d2ff, #cdb4db, #ffc8dd);
      color: #333;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .swiper { width: 100%; height: 100vh; }
    .swiper-slide {
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 30px;
      box-sizing: border-box;
      text-align: center;
      font-size: 1.2rem;
    }
    .card {
      background: #fff;
      padding: 25px;
      border-radius: 20px;
      border: 4px solid #ffafcc;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      max-width: 600px;
    }
    .content {
      font-size: 1.4rem;
      margin-bottom: 15px;
      color: #333;
    }
    .date {
      font-size: 0.9rem;
      color: #666;
    }
    .message {
      margin-top: 15px;
      font-size: 1rem;
      color: #ff4d6d;
      font-weight: bold;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="swiper">
    <div class="swiper-wrapper" id="slides"></div>
    <div class="swiper-pagination"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    async function loadData() {
      const sheetId = "YOUR_SPREADSHEET_ID"; // 自分のIDに変える
      const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv`;
      const res = await fetch(url);
      const text = await res.text();
      const rows = text.split("\n").slice(1);

      const slidesEl = document.getElementById("slides");

      rows.forEach(row => {
        const cols = row.split(",");
        const timestamp = cols[0];
        const nickname = cols[1];
        const content = cols[2];

        if (content && content.trim() !== "") {
          const slide = document.createElement("div");
          slide.className = "swiper-slide";
          slide.innerHTML = `
            <div class="card">
              <div class="content">「${content}」</div>
              <div class="date">${timestamp} — ${nickname}</div>
              <div class="message">🌸 だいじょうぶ！あなたは一人じゃないよ 🌸</div>
            </div>
          `;
          slidesEl.appendChild(slide);
        }
      });

      new Swiper(".swiper", {
        loop: true,
        pagination: { el: ".swiper-pagination", clickable: true },
        autoplay: { delay: 6000 },
        effect: "slide"
      });
    }

    loadData();
  </script>
</body>
</html>
