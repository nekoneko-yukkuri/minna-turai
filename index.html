<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>みんなのつらいこと</title>
  <style>
    body {
      background: #fff8f0;
      font-family: "Comic Sans MS", "Chalkboard SE", cursive;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      width: 80%;
      max-width: 600px;
      min-height: 150px;
      background: #fff;
      border: 3px dashed #444;
      border-radius: 16px;
      box-shadow: 5px 5px 0 #aaa;
      padding: 20px;
      font-size: 1.4em;
      text-align: center;
      position: relative;
      animation: fadeIn 0.6s ease;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card" id="card">読み込み中…</div>

  <script>
    const sheetUrl = "https://docs.google.com/spreadsheets/d/1vDbt5nQeH_zgMjJCDnMaB6oGhMMPc2vv-ixQ4zYI9A8/gviz/tq?tqx=out:csv";
    let rows = [];
    let index = 0;

    async function loadData() {
      try {
        const res = await fetch(sheetUrl);
        const text = await res.text();
        const lines = text.split("\n").map(l => l.split(","));
        
        // 1行目（ヘッダー）を除外
        rows = lines.slice(1).filter(r => r[2] && r[2].trim() !== "");
      } catch (e) {
        document.getElementById("card").textContent = "データを読み込めませんでした。";
      }
    }

    function showNext() {
      if (rows.length === 0) return;
      const card = document.getElementById("card");
      card.textContent = rows[index][2]; // C列（つらいことをかいてね）
      index = (index + 1) % rows.length;
    }

    async function start() {
      await loadData();
      showNext();
      setInterval(showNext, 4000); // 4秒ごとに切り替え
    }

    start();
  </script>
</body>
</html>
